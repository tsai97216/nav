<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>URL Normalization Test</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:24px;background:#f5f6f8;color:#202124}main{max-width:760px;margin:auto}h1{font-size:24px}.summary{font-size:18px;font-weight:700;margin:16px 0}.test{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0000000d}.test strong{display:block;margin-bottom:8px}.pass{color:#16803c}.fail{color:#c5221f}code{display:block;background:#f1f3f4;padding:8px;border-radius:8px;overflow:auto;margin-top:6px;font-size:13px}.note{color:#5f6368;font-size:14px}
</style>
</head>
<body>
<main>
<h1>URL Normalization 驗收</h1>
<p class="note">此頁直接呼叫 NAV 目前使用的 norm() 與 key()，只用於本次驗收。</p>
<div id="summary" class="summary">測試中…</div>
<div id="tests"></div>
</main>
<script src="js/data.js?v=2.7.8"></script>
<script>
const cases=[
['移除 #fragment','https://example.com/#test','https://example.com/'],
['Hostname 統一小寫','https://EXAMPLE.COM/','https://example.com/'],
['合併連續 /','https://example.com///path//','https://example.com/path/'],
['移除結尾 /','https://example.com','https://example.com/'],
['移除追蹤參數','https://example.com/?utm_source=test&gclid=123','https://example.com/'],
['Query 參數排序','https://example.com/?a=1&b=2','https://example.com/?b=2&a=1']
];
const negative=['保留正常 Query 參數','https://example.com/?page=1','https://example.com/?page=2'];
const results=[...cases.map(([name,a,b])=>({name,pass:key({url:a})===key({url:b}),a,b,ka:key({url:a}),kb:key({url:b})})),(()=>{const [name,a,b]=negative;return{name,pass:key({url:a})!==key({url:b}),a,b,ka:key({url:a}),kb:key({url:b})}})()];
const passed=results.filter(x=>x.pass).length;document.getElementById('summary').textContent=`${passed} / ${results.length} tests passed`;document.getElementById('summary').className='summary '+(passed===results.length?'pass':'fail');document.getElementById('tests').innerHTML=results.map((x,i)=>`<section class="test"><strong>${i+1}. ${x.name} <span class="${x.pass?'pass':'fail'}">${x.pass?'PASS':'FAIL'}</span></strong><code>A: ${x.a}</code><code>B: ${x.b}</code><code>Key A: ${x.ka}</code><code>Key B: ${x.kb}</code></section>`).join('');
</script>
</body>
</html>
