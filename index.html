<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Chi 的個人網站導航與常用工具箱">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chi NAV">
<link rel="manifest" href="manifest.json">
<title>Chi 的工具箱</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">C</div>
      <div>
        <h1>Chi 的工具箱</h1>
        <p>Personal Navigator</p>
      </div>
    </div>
    <nav class="nav-menu" id="js-nav-menu" aria-label="網站分類"></nav>
  </aside>

  <main id="home">
    <header class="topbar">
      <div class="page-intro">
        <span class="eyebrow">PERSONAL NAVIGATION</span>
        <h2>首頁</h2>
        <p>常用網站與各個內容區塊，都可以直接在這裡瀏覽。</p>
      </div>
      <div class="search-box" role="search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="search-input" type="search" placeholder="搜尋網站或功能…" autocomplete="off" aria-label="搜尋網站或功能">
        <span class="shortcut"><kbd>Ctrl</kbd><kbd>K</kbd></span>
        <span id="search-result-info" aria-live="polite"></span>
      </div>
    </header>

    <div id="quick-sections"></div>
    <div id="js-main-content"></div>

    <footer class="site-footer">
      <span>Chi NAV</span>
      <span id="site-version">v1.7.3</span>
    </footer>
  </main>

  <div class="toast" id="js-toast" role="status">
    <div class="toast-title"><i class="fa-solid fa-circle-check"></i><span>腳本已複製</span></div>
    <div class="toast-desc">請到對應網頁開啟 Console 後貼上執行。</div>
  </div>

<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost") ) {
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(console.error));
  }
</script>
</body>
</html>
