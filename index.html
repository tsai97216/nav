<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080c16">
<meta name="description" content="Chi 的個人網站導航與常用工具箱">
<title>Chi 的工具箱</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sidebar">
  <div class="sidebar-header">
    <h1>🚀 Chi 的工具箱</h1>
    <span class="version">v1.0.0 | 2026.07</span>
  </div>
  <div class="nav-menu" id="js-nav-menu"></div>
</div>
<main>
  <header class="hero">
    <div class="hero-copy">
      <span class="hero-kicker"><i class="fa-solid fa-compass"></i> PERSONAL NAVIGATION</span>
      <h2>找到你要的，<span>就這麼簡單。</span></h2>
      <p>常用網站、遊戲、二次元、AI 與各種工具，都集中在這裡。</p>
    </div>
    <div class="search-box">
      <i class="fa-solid fa-search"></i>
      <input id="search-input" type="text" placeholder="搜尋工具、網站、功能..." autocomplete="off">
      <kbd>Ctrl K</kbd>
    </div>
  </header>
  <div id="js-main-content"></div>
</main>
<div class="toast" id="js-toast">
  <div class="toast-title"><i class="fa-solid fa-circle-check"></i><span>腳本代碼已複製到剪貼簿！</span></div>
  <div class="toast-desc">請至對應網頁按 F12 打開 Console，貼上並執行。</div>
</div>
<script src="app.js"></script>
</body>
</html>
