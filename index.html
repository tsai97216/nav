<meta name="mobile-web-app-capable" content="yes">

<body>
<aside class="sidebar">
  <div class="brand" id="brand-home" role="button" tabindex="0" aria-label="回到首頁"><div class="brand-mark"><img class="brand-icon brand-icon-light" src="assets/icon/icon-bw.png" alt=""><img class="brand-icon brand-icon-dark" src="assets/icon/icon-wb.png" alt=""><i class="fa-solid fa-grip-lines-vertical sidebar-open-icon" aria-hidden="true"></i></div><div><h1>Chi 的工具箱</h1><p>Personal Navigator</p></div></div>
  <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="收合側邊欄" title="收合側邊欄"><i class="fa-solid fa-grip-lines-vertical" aria-hidden="true"></i></button>
  <nav class="nav-menu" id="js-nav-menu" aria-label="網站分類"></nav>
</aside>
<main id="home" class="main-content">
  <header class="topbar"><div class="page-intro"><span class="eyebrow">CHI NAV</span><h2>Chi 的工具箱</h2><p>常用網站與各個內容區塊，都可以直接在這裡瀏覽。</p></div><div class="search-box" role="search"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><input id="search-input" type="search" placeholder="搜尋網站、分類或關鍵字…" autocomplete="off" aria-label="搜尋網站、分類或關鍵字"><button class="search-clear" id="search-clear" type="button" aria-label="清除搜尋"><i class="fa-solid fa-xmark"></i></button><span class="shortcut"><kbd>Ctrl</kbd><kbd>K</kbd></span><span id="search-result-info" aria-live="polite"></span></div></header>
  <div id="js-main-content"></div>
  <footer class="site-footer"><span>Chi NAV</span><span id="site-version">v2.7.16</span></footer>
</main>
<div class="command-palette" id="command-palette" aria-hidden="true"><div class="command-backdrop" data-command-close></div><section class="command-dialog" role="dialog" aria-modal="true" aria-labelledby="command-title"><div class="command-head"><i class="fa-solid fa-terminal" aria-hidden="true"></i><input id="command-input" type="search" placeholder="輸入網站、分類或指令…" autocomplete="off" aria-label="Command Palette"><button type="button" data-command-close aria-label="關閉"><i class="fa-solid fa-xmark"></i></button></div><div class="command-hint" id="command-hint">↑ ↓ 選擇　·　Enter 開啟　·　Esc 關閉</div><div class="command-results" id="command-results"></div></section></div>
<div class="toast" id="js-toast" role="status"><div class="toast-title"><i class="fa-solid fa-circle-check" aria-hidden="true"></i><span>腳本已複製</span></div><div class="toast-desc">請到對應網頁開啟 Console 後貼上執行。</div></div>
<div class="update-toast" id="update-toast" role="status" aria-live="polite"><div><strong>發現新版本</strong><span id="update-version">網站已更新</span></div><div class="update-actions"><button id="update-reload" type="button">立即更新</button><button id="update-close" type="button" class="update-close" aria-label="關閉更新提示">關閉</button></div></div>
<script src="js/data.js?v=2.7.16"></script><script src="js/storage.js?v=2.7.16"></script><script src="js/update.js?v=2.7.16"></script><script src="js/search.js?v=2.7.16"></script><script src="js/navigation.js?v=2.7.16"></script><script src="js/render.js?v=2.7.16"></script><script src="js/app.js?v=2.7.16"></script><script src="js/card-tooltip.js?v=2.7.16"></script><script src="js/bootstrap.js?v=2.7.16"></script>
