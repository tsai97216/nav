name: Sync NAV Version

on:
  push:
    paths:
      - 'data/version.json'
      - '.github/workflows/sync-version.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize managed version references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          version = json.loads(Path('data/version.json').read_text(encoding='utf-8'))['version']
          if not re.fullmatch(r'v\d+\.\d+\.\d+\.\d+', version):
              raise SystemExit(f'Invalid NAV version: {version}')
          plain = version[1:]

          files = [Path('index.html'), Path('js/app.js'), Path('js/bootstrap.js'), Path('sw.js'), Path('manifest.json'), Path('css/design-system.css'), Path('css/card-layout.css')]
          version_pattern = re.compile(r'v\d+\.\d+\.\d+\.\d+|v\d+\.\d+\.\d+|(?<!\d)\d+\.\d+\.\d+\.\d+(?!\d)|(?<!\d)\d+\.\d+\.\d+(?!\d)')

          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              text = version_pattern.sub(lambda m: version if m.group(0).startswith('v') else plain, text)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify synchronized files
        run: python scripts/verify-version.py

      - name: Commit synchronized files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/app.js js/bootstrap.js sw.js manifest.json css/design-system.css css/card-layout.css
          if git diff --cached --quiet; then
            echo 'No managed version changes needed.'
            exit 0
          fi
          git commit -m "chore: sync NAV version"
          git push
