name: Sync NAV Version

on:
  push:
    paths:
      - 'data/version.json'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize managed version references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re, subprocess

          version = json.loads(Path('data/version.json').read_text(encoding='utf-8'))['version']
          if not re.fullmatch(r'v\d+\.\d+\.\d+\.\d+', version):
              raise SystemExit(f'Invalid NAV version: {version}')
          plain = version[1:]
          try:
              old = json.loads(subprocess.check_output(['git','show','HEAD^:data/version.json'], text=True))['version']
          except Exception:
              old = ''
          old_plain = old[1:] if old.startswith('v') else old

          files = [Path('index.html'), Path('js/bootstrap.js'), Path('sw.js'), Path('manifest.json'), Path('css/design-system.css'), Path('css/card-layout.css')]
          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              if old:
                  text = text.replace(old, version).replace(old_plain, plain)
              path.write_text(text, encoding='utf-8')

          app = Path('js/app.js')
          if app.exists():
              text = app.read_text(encoding='utf-8')
              text, count = re.subn(r"(const\s+VERSION\s*=\s*['\"])v\d+\.\d+\.\d+\.\d+(['\"])", rf"\g<1>{version}\g<2>", text, count=1)
              if count != 1:
                  raise SystemExit('Could not locate const VERSION in js/app.js')
              app.write_text(text, encoding='utf-8')
          PY

      - name: Commit synchronized files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/app.js js/bootstrap.js sw.js manifest.json css/design-system.css css/card-layout.css
          if git diff --cached --quiet; then
            echo 'No managed version changes needed.'
            exit 0
          fi
          git commit -m "chore: sync NAV version"
          git push
