name: Sync NAV Version

on:
  push:
    paths:
      - 'data/version.json'
      - '.github/workflows/sync-version.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize managed version references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          version = json.loads(Path('data/version.json').read_text(encoding='utf-8'))['version']
          if not re.fullmatch(r'v\d+\.\d+\.\d+\.\d+', version):
              raise SystemExit(f'Invalid NAV version: {version}')
          plain = version[1:]
          three_or_four = r'\d+\.\d+\.\d+(?:\.\d+)?'

          def replace_query(text):
              return re.sub(r'(?<=\\?v=)' + three_or_four, plain, text)

          # Only replace NAV-managed version references. Do not touch unrelated
          # dependency versions such as Font Awesome 6.4.0.
          for name in ['index.html', 'js/bootstrap.js', 'sw.js', 'manifest.json', 'css/design-system.css', 'css/card-layout.css']:
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              text = replace_query(text)
              if name == 'index.html':
                  text = re.sub(r'(id=["\']site-version["\'][^>]*>v)' + three_or_four, rf'\g<1>{plain}', text)
              if name == 'sw.js':
                  text = re.sub(r'(CACHE_NAME\s*=\s*["\'][^"\']*?v)' + three_or_four, rf'\g<1>{plain}', text)
              path.write_text(text, encoding='utf-8')

          app = Path('js/app.js')
          if app.exists():
              text = app.read_text(encoding='utf-8')
              text, count = re.subn(r"(const\s+VERSION\s*=\s*['\"])v\d+\.\d+\.\d+(?:\.\d+)?(['\"])", rf'\g<1>{version}\g<2>', text, count=1)
              if count != 1:
                  raise SystemExit('Could not locate const VERSION in js/app.js')
              app.write_text(text, encoding='utf-8')
          PY

      - name: Verify synchronized files
        run: python scripts/verify-version.py

      - name: Commit synchronized files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/app.js js/bootstrap.js sw.js manifest.json css/design-system.css css/card-layout.css
          if git diff --cached --quiet; then
            echo 'No managed version changes needed.'
            exit 0
          fi
          git commit -m "chore: sync NAV version"
          git push
