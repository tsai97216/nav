name: tags-cleanup-once
on:
  push:
    paths:
      - .github/workflows/tags-cleanup-once.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean up tags and versions
        run: |
          python - <<'PY'
          import json, pathlib, re
          p=pathlib.Path('data/data.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          moved=None
          for tax in data:
              if tax.get('taxonomy')=='工具':
                  for group in tax.get('list',[]):
                      if group.get('term')=='文字':
                          kept=[]
                          for link in group.get('links',[]):
                              if link.get('title')=='Notion':
                                  moved=link
                              else:
                                  kept.append(link)
                          group['links']=kept
                          if not group['links']:
                              tax['list'].remove(group)
                          break
                  if moved:
                      target=next((g for g in tax.get('list',[]) if g.get('term')=='筆記與知識管理'),None)
                      if target is None:
                          tax['list'].append({'term':'筆記與知識管理','links':[moved]})
                      elif not any(x.get('url')==moved.get('url') for x in target.get('links',[])):
                          target.setdefault('links',[]).append(moved)
                  break
          for tax in data:
              for group in tax.get('list',[]):
                  if group.get('term')=='文字':
                      group['term']='翻譯'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          files=['index.html','js/app.js','js/bootstrap.js','sw.js','manifest.json','css/style.css','css/responsive.css','css/theme.css','css/update.css','css/card-tooltip.css','css/enhancements.css','js/theme.js','js/card-tooltip.js']
          for f in files:
              q=pathlib.Path(f)
              if q.exists():
                  s=q.read_text(encoding='utf-8')
                  s=s.replace('2.7.7','2.7.8').replace('v2.7.7','v2.7.8')
                  q.write_text(s,encoding='utf-8')
          vp=pathlib.Path('data/version.json')
          v=json.loads(vp.read_text(encoding='utf-8'))
          v['version']='v2.7.8'
          vp.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/data.json data/version.json index.html js/app.js js/bootstrap.js sw.js manifest.json css js
          git commit -m 'refactor: clean up tags' || true
          rm -f .github/workflows/tags-cleanup-once.yml
          git add -A
          git commit -m 'chore: remove one-time tags cleanup workflow' || true
          git push
